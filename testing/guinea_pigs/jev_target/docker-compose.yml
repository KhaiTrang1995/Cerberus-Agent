# RedAmon Jev end-to-end guinea pig.
#
# Bring up:   docker compose up -d --build
# Bring down: docker compose down
#
# Three hosts on 192.88.96.0/24 (6to4 relay prefix: Python's SSRF guard treats
# it as global so probes go through; nothing leaves the host). Recon runs
# network_mode:host and reaches them over the local bridge route.
#
#   192.88.96.10  richapp - full PHP/Apache app, many dirs, JS bundle, /login
#   192.88.96.20  waf     - Jev-only WAF challenge (no vendor header)
#   192.88.96.30  thin    - "coming soon" placeholder
#
# Create an IP-mode project over all three addresses.

services:

  jev-richapp:
    build: .
    image: redamon-jev-target:latest
    container_name: redamon-jev-richapp
    restart: unless-stopped
    environment:
      ROLE: richapp
      PORT: "80"
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      jev_lab:
        ipv4_address: 192.88.96.10

  jev-waf:
    build: .
    image: redamon-jev-target:latest
    container_name: redamon-jev-waf
    restart: unless-stopped
    depends_on:
      - jev-richapp
    environment:
      ROLE: waf
      PORT: "80"
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      jev_lab:
        ipv4_address: 192.88.96.20

  jev-thin:
    build: .
    image: redamon-jev-target:latest
    container_name: redamon-jev-thin
    restart: unless-stopped
    depends_on:
      - jev-richapp
    environment:
      ROLE: thin
      PORT: "80"
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      jev_lab:
        ipv4_address: 192.88.96.30

networks:
  jev_lab:
    name: redamon_jev_lab
    driver: bridge
    ipam:
      config:
        - subnet: 192.88.96.0/24
          gateway: 192.88.96.1

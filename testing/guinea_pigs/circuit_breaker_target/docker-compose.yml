# RedAmon circuit-breaker guinea pig
#
# Bring up:    docker compose up -d --build
# Bring down:  docker compose down
# Healthy:     http://192.88.96.10/        (real surface -> real findings)
# Dead host:   http://192.88.96.20/        (accepts TCP, resets -> ConnectionError)
#
# Create an IP-mode project over BOTH addresses (192.88.96.10, 192.88.96.20).
# The recon pipeline finds findings on .10; on .20 every requests-based probe
# raises ConnectionError, so after 3 the HostHealth breaker opens: .20 is added
# to recon_skipped_hosts, coverage is reported degraded, and .10's findings are
# kept by the prune.
#
# 192.88.96.0/24 (6to4 relay prefix) so Python's SSRF guard treats it as global
# and lets probes through; nothing leaves the host. Recon runs network_mode:host
# and reaches the lab over the local bridge route.

services:

  cb-live:
    build: .
    image: redamon-cb-target:latest
    container_name: redamon-cb-live
    restart: unless-stopped
    environment:
      ROLE: live
      PORTS: "80"
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      cb_lab:
        ipv4_address: 192.88.96.10

  cb-dead:
    build: .
    image: redamon-cb-target:latest
    container_name: redamon-cb-dead
    restart: unless-stopped
    depends_on:
      - cb-live
    environment:
      ROLE: deadtcp
      PORTS: "80,443"
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      cb_lab:
        ipv4_address: 192.88.96.20

networks:
  cb_lab:
    name: redamon_cb_lab
    driver: bridge
    ipam:
      config:
        - subnet: 192.88.96.0/24
          gateway: 192.88.96.1

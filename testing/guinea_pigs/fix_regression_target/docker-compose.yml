# RedAmon fix-regression guinea pig
#
# Bring up:    docker compose up -d --build
# Bring down:  docker compose down
#
# Create an IP-mode project over BOTH addresses (192.88.95.10, 192.88.95.20).
# See README.md for what each port proves and the exact assertions.
#
# 192.88.95.0/24 is globally-classified, so recon's SSRF/ip_filter guard lets
# probes through, but nothing leaves the host: recon runs network_mode=host and
# reaches the lab over the local bridge route. No host ports are published.
# Other labs hold 192.88.96/97/98/99.0/24; 192.88.100.0/24 is real address
# space. Keep this /24 to this lab.

services:

  fixreg-rich:
    build: .
    image: redamon-fixreg-target:latest
    container_name: redamon-fixreg-rich
    restart: unless-stopped
    environment:
      ROLE: rich
      HTTP_PORTS: "80,8080"
      SERVER_HEADERS: "8080=nginx/1.25.3"
      TLS_PORTS: "8443"
      OPEN_TCP_PORTS: "22,3306"
      REDIS_PORTS: "6379"
    mem_limit: 128m
    pids_limit: 256
    cpus: 0.5
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      fixreg_lab:
        ipv4_address: 192.88.95.10

  fixreg-knegative:
    build: .
    image: redamon-fixreg-target:latest
    container_name: redamon-fixreg-knegative
    restart: unless-stopped
    depends_on:
      - fixreg-rich
    environment:
      ROLE: knegative
      HTTP_PORTS: "8080"
      SERVER_HEADERS: "8080=Apache/2.4.58 (Unix)"
      TLS_PORTS: "443"
    mem_limit: 64m
    pids_limit: 128
    cpus: 0.25
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      fixreg_lab:
        ipv4_address: 192.88.95.20

networks:
  fixreg_lab:
    name: redamon_fixreg_lab
    driver: bridge
    ipam:
      config:
        - subnet: 192.88.95.0/24
          gateway: 192.88.95.1

# The WAF EDGE: what the hostname resolves to in production. A minimal signature WAF
# that returns 403 on classic attack patterns, and otherwise proxies to the origin.
# This is the "blocked" side of the class-13 differential: the SAME probe that the
# origin serves is refused here. quote() keeps '.' and '/' literal, so the traversal
# probe stays matchable in $request_uri; the XSS/SQLi probes are matched url-encoded.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        if ($request_uri ~* "(\.\./|etc/passwd|%3[Cc]script|%27|union(\s|\+|%20)+select)") {
            return 403 "blocked by edge WAF\n";
        }
        proxy_pass https://origin:443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
}

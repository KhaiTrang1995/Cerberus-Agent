# The ORIGIN: the real server, directly reachable by IP. It has NO WAF, so it serves
# every request -- including signature probes -- with 200. This is the "allowed" side
# of the class-13 blocked-vs-allowed differential.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        default_type text/plain;
        return 200 "origin: served directly (no WAF in front)\n";
    }
}

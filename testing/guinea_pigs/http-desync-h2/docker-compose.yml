# Self-contained vulnerable target for the HTTP/2 downgrade smuggling leg of the
# RedAmon http_request_smuggling agent skill (class 3). An h2c edge that downgrades to
# an h1 backend and copies the client's content-length verbatim (H2.CL). A lying
# content-length smuggles a request the h1 backend frames wrong; /admin is blocked at
# the edge and only reachable via the smuggle.
#
#   docker compose up -d --build
#   python3 tests/verify_h2.py
services:
  backend:
    build: ./backend
    container_name: h2-guinea-backend
    environment:
      - BACKEND_PORT=5000
      - HRS_FLAG=REDAMON_HRS{h2_downgrade_crlf_injection}
    expose:
      - "5000"
    ports:
      - "9099:5000"
    networks:
      - h2net
  edge:
    build: ./frontend
    container_name: h2-guinea-edge
    depends_on:
      - backend
    environment:
      - FRONT_PORT=80
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
    ports:
      - "9098:80"
    networks:
      - h2net
networks:
  h2net:
    name: h2-guinea-net
